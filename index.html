<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Wallet</title>
    <link rel="stylesheet" href="index.css">
    <link rel="manifest" href="manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</head>

<body>
    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <div class="logo" style="margin-bottom: 10px;">✨ Pocket Wallet</div>
            <p style="color: #64748b; margin-bottom: 25px;">Sign in to access your private vault.</p>
            <button id="google-login-btn" class="google-btn">
                <svg class="google-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                    <path fill="#EA4335"
                        d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                    <path fill="#4285F4"
                        d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                    <path fill="#FBBC05"
                        d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                    <path fill="#34A853"
                        d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                    <path fill="none" d="M0 0h48v48H0z" />
                </svg>
                Sign in with Google
            </button>
        </div>
    </div>

    <div id="app-container" class="app-card" style="display: none;">

        <header class="app-header">
            <div class="header-top">
                <div class="logo">✨ Pocket Wallet</div>
                <button id="logout-btn" class="logout-btn">Logout</button>
            </div>
            <p class="subtitle" id="welcome-text">Track your daily personal expenses</p>
        </header>

        <div class="budget-section">
            <div class="budget-header">
                <span class="budget-title">Monthly Limit: ₹</span>
                <input type="number" id="budget-input" placeholder="Set Budget" class="budget-input-field">
            </div>
            <div class="progress-bar-container">
                <div id="progress-fill" class="progress-fill"></div>
            </div>
        </div>

        <div class="balance-card">
            <span class="balance-label">Total Spent</span>
            <h2 id="total-amount">₹0.00</h2>
        </div>

        <div class="input-section">
            <div class="form-group">
                <label for="expense-name">Item Name</label>
                <input type="text" id="expense-name" placeholder="e.g., Boba Tea">
            </div>

            <div class="form-group">
                <label for="expense-category">Category</label>
                <select id="expense-category" class="category-select">
                    <option value="🍔 Food">🍔 Food</option>
                    <option value="🚌 Transport">🚌 Transport</option>
                    <option value="🛒 Groceries">🛒 Groceries</option>
                    <option value="🎮 Entertainment">🎮 Entertainment</option>
                    <option value="📦 Other">📦 Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="expense-amount">Amount</label>
                <div class="currency-input">
                    <span class="currency-symbol">₹</span>
                    <input type="number" id="expense-amount" placeholder="0.00">
                </div>
            </div>

            <button id="add-btn" class="submit-btn">Log Expense ➜</button>
        </div>

        <div class="history-section">
            <h3>Recent Transactions</h3>
            <ul id="expense-list"></ul>
        </div>
    </div>

    <script src="index.js" type="module"></script>
</body>

</html>
